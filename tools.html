<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolora • All Tools, One Place</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        :root {
            --navy: #0B1020;
        }
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .logo-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .hero-bg {
            background: radial-gradient(at center bottom, #1E2937 0%, #0B1020 70%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tool-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .tool-card:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 0 30px 60px -15px rgb(37 99 235 / 0.3);
        }

        .gradient-text {
            background: linear-gradient(90deg, #2563EB, #6C63FF, #F15BB5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .blob {
            animation: float 25s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(80px, 60px) rotate(15deg); }
        }

        .nav-link {
            position: relative;
        }
        
        .nav-link:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background: linear-gradient(to right, #2563EB, #6C63FF);
            transition: width 0.3s ease;
        }
        
        .nav-link:hover:after {
            width: 100%;
        }
    </style>
</head>
<body class="bg-[#0B1020] text-white overflow-x-hidden">
    <!-- NAVBAR -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass border-b border-white/10">
        <div class="max-w-screen-2xl mx-auto px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-x-16">
                <!-- Logo -->
                <div class="flex items-center gap-x-3">
                    <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 flex items-center justify-center text-2xl font-bold logo-font shadow-xl shadow-blue-500/50">T</div>
                    <div>
                        <span class="logo-font text-3xl font-semibold tracking-tighter">toolora</span>
                    </div>
                </div>

                <!-- Search -->
                <div class="relative w-96">
                    <div class="glass rounded-3xl px-6 py-3 flex items-center gap-x-3 text-sm border border-white/10 focus-within:border-blue-500/50 transition-colors">
                        <i class="fa-solid fa-magnifying-glass text-blue-400"></i>
                        <input type="text" id="nav-search" 
                               class="bg-transparent outline-none flex-1 placeholder:text-white/40" 
                               placeholder="Search tools... (try JSON Formatter)">
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-x-8 text-sm">
                <a href="#" onclick="showSection('all')" class="nav-link text-white/80 hover:text-white transition-colors">Tools</a>
                <a href="#" class="nav-link text-white/80 hover:text-white transition-colors">API</a>
                <a href="#" class="nav-link text-white/80 hover:text-white transition-colors">Blog</a>
                <a href="#" class="nav-link text-white/80 hover:text-white transition-colors">Pricing</a>

                <div class="flex items-center gap-x-6">
                    <button onclick="toggleDarkMode()" class="w-10 h-10 glass rounded-2xl flex items-center justify-center hover:bg-white/10 transition-colors">
                        <i class="fa-solid fa-moon text-lg"></i>
                    </button>
                    
                    <button onclick="fakeNotification()" class="w-10 h-10 glass rounded-2xl flex items-center justify-center hover:bg-white/10 transition-colors relative">
                        <i class="fa-solid fa-bell text-lg"></i>
                        <span class="absolute -top-1 -right-1 w-4 h-4 bg-pink-500 rounded-full flex items-center justify-center text-[10px] font-medium">3</span>
                    </button>

                    <div class="flex items-center gap-x-3">
                        <div class="w-8 h-8 bg-gradient-to-br from-purple-400 to-pink-400 rounded-2xl flex items-center justify-center text-xs font-bold">JD</div>
                        <div>
                            <div class="text-sm font-medium">Jamie Dixon</div>
                            <div class="text-xs text-white/50 -mt-0.5">Pro</div>
                        </div>
                    </div>

                    <button onclick="alert('Welcome to Toolora Pro ✨')" 
                            class="px-8 py-3.5 bg-white text-black font-semibold rounded-3xl hover:scale-105 active:scale-95 transition-all flex items-center gap-x-2 shadow-xl shadow-blue-500/30">
                        <span>Launch App</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <header class="hero-bg min-h-screen flex items-center pt-20 relative overflow-hidden">
        <!-- Background Elements -->
        <div class="absolute inset-0">
            <!-- Large Blobs -->
            <div class="absolute
